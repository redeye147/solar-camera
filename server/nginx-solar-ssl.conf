# /etc/nginx/sites-enabled/solar-ssl（ConoHa 上の設定の写し。証明書は Let's Encrypt）
server {
    server_name solar.redeye-lab.com;

    root /var/www/html/solar;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /images/ {
        autoindex on;
        autoindex_format html;
    }

    location /monthly/ {
        autoindex on;
        autoindex_format html;
    }

    # 前方一致のため /capture… で始まるアドレスはすべてここへ回る（結果ファイルは shot_result.json）
    location /capture {
        proxy_pass http://127.0.0.1:5001/capture;
        proxy_method POST;
    }

    location /capture_status {
        proxy_pass http://127.0.0.1:5001/capture_status;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/solar.redeye-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solar.redeye-lab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = solar.redeye-lab.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name solar.redeye-lab.com;
    return 404;
}
